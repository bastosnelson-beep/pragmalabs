<!DOCTYPE html>

  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="assets/logo/pragma4-icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>

  <header class="navbar">
    <div class="container">
      <a href="/" class="logo"><img src="assets/logo/pragma4-logo-horizontal.svg" alt="Pragma4 — Real-world value, through AI" width="220" height="48" /></a>
      <nav class="nav-links" id="nav-links">
        <a href="/#capabilities">Capacités</a>
        <a href="/#method">Méthode</a>
        <a href="/services">Services</a>
        <a href="/contact" class="btn btn-primary">Nous contacter</a>
        <a href="/contact#faq" class="nav-faq" title="Questions fréquentes">FAQ</a>
        <div class="lang-switch">
          <a href="/confirmation" class="active">FR</a>
          <a href="/en/confirm">EN</a>
          <a href="/pt/confirmacao">PT</a>
        </div>
      </nav>
      <button class="nav-toggle" aria-label="Menu">☰</button>

  <main class="legal unsub">
    <div class="container legal-container unsub-box"
         data-endpoint="https://adamlippes.app.n8n.cloud/webhook/pragma4-newsletter-confirm" data-ok="C&#x27;est fait : votre inscription est confirmée. Bienvenue ! Vous recevrez la prochaine newsletter Pragma4." data-bad="Ce lien de confirmation n&#x27;est plus valide : il a peut-être expiré (7 jours). Inscrivez-vous à nouveau depuis le bas de n&#x27;importe quelle page." data-err="Erreur. Réessayez dans un instant ou écrivez-nous à hello@pragma4.com." data-sending="Confirmation en cours...">
      <h1>Confirmez votre inscription</h1>
      <p class="unsub-intro">Un dernier clic pour recevoir la newsletter Pragma4 sur l&#x27;actualité de l&#x27;IA.</p>
      <button type="button" class="btn btn-primary unsub-btn">Confirmer mon inscription</button>
      <p class="unsub-status" role="status" aria-live="polite"></p>
      <p class="unsub-back"><a href="/">← Retour à l&#x27;accueil</a></p>
    </div>
  </main>

  <footer>
    <div class="container footer-bottom">
      <div class="footer-brand"><a href="/" class="footer-logo"><img src="assets/logo/pragma4-logo-horizontal.svg" alt="Pragma4 — Real-world value, through AI" width="200" height="44" loading="lazy" /></a><span>Conçu pour l&#x27;impact.</span></div>
    </div>
    <div class="container footer-bottom">
      <span>© 2026 Pragma4. Tous droits réservés.</span>
    </div>
    <div class="wordmark" aria-hidden="true"><img src="assets/logo/pragma4-wordmark.svg" alt="" /></div>
