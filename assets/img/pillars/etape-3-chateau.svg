<style>.rot{transform-origin:220px 145px;animation:rot 48s linear infinite}.orbit{transform-origin:220px 145px;animation:rot 16s linear infinite}@keyframes rot{from{transform:rotate(0)}to{transform:rotate(360deg)}}.pulse{transform-origin:220px 145px;animation:pulse 4s ease-out infinite}@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.14);opacity:0}}.flag{transform-origin:220px 90px;animation:wave 1.8s ease-in-out infinite}@keyframes wave{0%,100%{transform:skewY(0) scaleX(1)}50%{transform:skewY(-9deg) scaleX(.86)}}.inc{stroke-dasharray:0 2;animation:inc 4.2s ease-in infinite}@keyframes inc{0%{stroke-dashoffset:0;opacity:0}12%{opacity:1}80%{stroke-dashoffset:-1;opacity:1}86%,100%{stroke-dashoffset:-1;opacity:0}}.inct{stroke-dasharray:.14 2;animation:inct 4.2s ease-in infinite}@keyframes inct{0%{stroke-dashoffset:.14;opacity:0}12%{opacity:.45}80%{stroke-dashoffset:-.86;opacity:.45}86%,100%{stroke-dashoffset:-.86;opacity:0}}.imp{transform-box:fill-box;transform-origin:center;opacity:0;animation:imp 4.2s ease-out infinite}@keyframes imp{0%,78%{opacity:0;transform:scale(.4)}82%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(2.2)}}@media (prefers-reduced-motion: reduce){.rot,.orbit,.pulse,.flag,.inc,.inct,.imp{animation:none}.inc,.inct,.imp,.pulse{opacity:0}}</style>
