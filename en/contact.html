<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="alternate" hreflang="fr" href="https://pragma4.com/contact.html" />
  <link rel="alternate" hreflang="en" href="https://pragma4.com/en/contact.html" />
  <link rel="alternate" hreflang="pt" href="https://pragma4.com/pt/contact.html" />
  <link rel="alternate" hreflang="x-default" href="https://pragma4.com/en/contact.html" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pragma4 | Contact us</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo/pragma4-icon.svg" />
  <meta name="description" content="Book a meeting with the Pragma4 team." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/styles.css" />
</head>
<body>

  <header class="navbar">
    <div class="container">
      <a href="index.html" class="logo"><img src="../assets/logo/pragma4-logo-horizontal.svg" alt="Pragma4 — Real-world value, through AI" width="220" height="48" /></a>
      <nav class="nav-links" id="nav-links">
        <a href="index.html#capabilities">Capabilities</a>
        <a href="index.html#method">Method</a>
        <!-- Masqué temporairement, à réactiver plus tard : <a href="index.html#news">News</a> -->
        <a href="contact.html" class="btn btn-primary">Contact us</a>
        <div class="lang-switch" aria-label="Language">
          <a href="../contact.html">FR</a>
          <a href="contact.html" class="active">EN</a>
          <a href="../pt/contact.html">PT</a>
        </div>
      </nav>
      <button class="nav-toggle" aria-label="Menu">☰</button>
    </div>
  </header>

  <section class="contact-hero">
    <div class="container">
      <span class="label">Contact us</span>
      <h1>Book a meeting with our team</h1>
      <p>We help the most demanding organizations become AI-native, turning frontier intelligence into measurable gains on their bottom line.</p>
    </div>
  </section>

  <!-- Form wired to the n8n webhook (workflow Pragma4 - Formulaire Contact) -->
  <form class="contact-form"
        data-sending="Sending..."
        data-success="Message sent. We will get back to you shortly."
        data-error="Send failed. Try again or email contact@pragma4.com.">
    <input type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="display:none" />
    <div class="row">
      <select name="request_type" required aria-label="Subject of your request">
        <option value="" disabled selected>Subject of your request</option>
        <option value="information">Information request</option>
        <option value="candidature">Apply</option>
      </select>
      <input type="text" name="country" placeholder="Country" autocomplete="country-name" required />
    </div>
    <div class="row">
      <input type="text" name="name" placeholder="Name" required />
      <input type="email" name="email" placeholder="Email" required />
    </div>
    <div class="row">
      <input type="tel" name="phone" placeholder="Phone (optional)" />
      <input type="text" name="company" placeholder="Company" />
    </div>
    <textarea name="message" rows="6" placeholder="Message" required></textarea>
    <label class="file-field">
      <span class="file-label">Attachments (optional): 2 files max, 5 MB each · PDF, Word, JPG, PNG</span>
      <input type="file" name="attachments" multiple accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,image/jpeg,image/png"
             data-too-many="You can attach up to 2 files." data-too-big="Each file must be under 5 MB: " data-bad-type="Format not accepted (PDF, Word, JPG or PNG): " />
    </label>
    <button type="submit" class="btn btn-primary">Submit</button>
  </form>

  <footer>
    <div class="container footer-bottom">
      <div class="footer-brand"><a href="index.html" class="footer-logo"><img src="../assets/logo/pragma4-logo-horizontal.svg" alt="Pragma4 — Real-world value, through AI" width="200" height="44" loading="lazy" /></a></div>
    </div>
    <div class="container footer-bottom">
      <span>© 2026 Pragma4. All rights reserved.</span>
      <div class="socials">
        <a class="li-link" href="https://www.linkedin.com/company/pragma4/" target="_blank" rel="noopener" aria-label="LinkedIn"><svg class="li-ico" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect width="24" height="24" rx="4" fill="#0A66C2"/><path fill="#fff" d="M5.3 9.4h2.9v9.3H5.3zM6.75 4.8a1.68 1.68 0 1 1 0 3.36 1.68 1.68 0 0 1 0-3.36zM10 9.4h2.8v1.27h.04c.39-.74 1.34-1.52 2.76-1.52 2.95 0 3.5 1.94 3.5 4.47v5.08h-2.9v-4.5c0-1.07-.02-2.46-1.5-2.46-1.5 0-1.73 1.17-1.73 2.38v4.58H10z"/></svg><span>LINKEDIN</span></a>
      </div>
    </div>
    <div class="wordmark" aria-hidden="true"><img src="../assets/logo/pragma4-wordmark.svg" alt="" /></div>
  </footer>

  <script src="../assets/script.js"></script>
</body>
</html>
