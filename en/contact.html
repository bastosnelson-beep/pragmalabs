<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PragmaLabs | Contact us</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo/pragmalabs-icon.svg" />
  <meta name="description" content="Book a meeting with the PragmaLabs team." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/styles.css" />
</head>
<body>

  <header class="navbar">
    <div class="container">
      <a href="index.html" class="logo"><img src="../assets/logo/pragmalabs-logo-horizontal.svg" alt="PragmaLabs — Real-world value, through AI" width="220" height="48" /></a>
      <nav class="nav-links" id="nav-links">
        <a href="index.html#capabilities">Capabilities</a>
        <a href="index.html#method">Method</a>
        <!-- Masqué temporairement, à réactiver plus tard : <a href="index.html#news">News</a> -->
        <a href="contact.html" class="btn btn-primary">Contact us</a>
        <div class="lang-switch" aria-label="Language">
          <a href="../contact.html">FR</a>
          <a href="contact.html" class="active">EN</a>
          <a href="../pt/contact.html">PT</a>
        </div>
      </nav>
      <button class="nav-toggle" aria-label="Menu">☰</button>
    </div>
  </header>

  <section class="contact-hero">
    <div class="container">
      <span class="label">Contact us</span>
      <h1>Book a meeting with our team</h1>
      <p>We help the most demanding organizations become AI-native, turning frontier intelligence into measurable gains on their bottom line.</p>
    </div>
  </section>

  <!-- Form wired to the n8n webhook (workflow PragmaLabs - Formulaire Contact) -->
  <form class="contact-form"
        data-sending="Sending..."
        data-success="Message sent. We will get back to you shortly."
        data-error="Send failed. Try again or email contact@pragma4.com.">
    <input type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="display:none" />
    <div class="row">
      <input type="text" name="name" placeholder="Name" required />
      <input type="email" name="email" placeholder="Email" required />
    </div>
    <div class="row">
      <input type="tel" name="phone" placeholder="Phone (optional)" />
      <input type="text" name="company" placeholder="Company" />
    </div>
    <textarea name="message" rows="6" placeholder="Message" required></textarea>
    <button type="submit" class="btn btn-primary">Submit</button>
  </form>

  <footer>
    <div class="container footer-bottom">
      <div class="footer-brand"><a href="index.html" class="footer-logo"><img src="../assets/logo/pragmalabs-logo-horizontal.svg" alt="PragmaLabs — Real-world value, through AI" width="200" height="44" loading="lazy" /></a></div>
    </div>
    <div class="container footer-bottom">
      <span>© 2026 PragmaLabs. All rights reserved.</span>
      <div class="socials">
        <a href="https://www.linkedin.com/company/pragma4/" target="_blank" rel="noopener">LINKEDIN</a>
      </div>
    </div>
    <div class="wordmark" aria-hidden="true"><img src="../assets/logo/pragmalabs-wordmark.svg" alt="" /></div>
  </footer>

  <script src="../assets/script.js"></script>
</body>
</html>
