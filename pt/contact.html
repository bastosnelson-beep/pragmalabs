<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <link rel="alternate" hreflang="fr" href="https://pragma4.com/contact.html" />
  <link rel="alternate" hreflang="en" href="https://pragma4.com/en/contact.html" />
  <link rel="alternate" hreflang="pt" href="https://pragma4.com/pt/contact.html" />
  <link rel="alternate" hreflang="x-default" href="https://pragma4.com/en/contact.html" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pragma4 | Fale connosco</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo/pragma4-icon.svg" />
  <meta name="description" content="Marque uma conversa com a equipa Pragma4." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/styles.css" />
</head>
<body>

  <header class="navbar">
    <div class="container">
      <a href="index.html" class="logo"><img src="../assets/logo/pragma4-logo-horizontal.svg" alt="Pragma4 — Real-world value, through AI" width="220" height="48" /></a>
      <nav class="nav-links" id="nav-links">
        <a href="index.html#capabilities">Capacidades</a>
        <a href="index.html#method">Método</a>
        <!-- Masqué temporairement, à réactiver plus tard : <a href="index.html#news">Notícias</a> -->
        <a href="contact.html" class="btn btn-primary">Fale connosco</a>
        <div class="lang-switch" aria-label="Idioma">
          <a href="../contact.html">FR</a>
          <a href="../en/contact.html">EN</a>
          <a href="contact.html" class="active">PT</a>
        </div>
      </nav>
      <button class="nav-toggle" aria-label="Menu">☰</button>
    </div>
  </header>

  <section class="contact-hero">
    <div class="container">
      <span class="label">Fale connosco</span>
      <h1>Marque uma conversa com a nossa equipa</h1>
      <p>Ajudamos as organizações mais exigentes a tornarem-se nativas de IA, transformando inteligência de ponta em ganhos mensuráveis no seu resultado.</p>
    </div>
  </section>

  <!-- Formulário ligado ao webhook n8n (workflow Pragma4 - Formulaire Contact) -->
  <form class="contact-form"
        data-sending="A enviar..."
        data-success="Mensagem enviada. Entraremos em contacto em breve."
        data-error="Falha no envio. Tente novamente ou escreva para contact@pragma4.com.">
    <input type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="display:none" />
    <div class="row">
      <select name="request_type" required aria-label="Assunto do seu pedido">
        <option value="" disabled selected>Assunto do seu pedido</option>
        <option value="information">Pedido de informações</option>
        <option value="candidature">Candidatar-se</option>
      </select>
      <input type="text" name="country" placeholder="País" autocomplete="country-name" required />
    </div>
    <div class="row">
      <input type="text" name="name" placeholder="Nome" required />
      <input type="email" name="email" placeholder="Email" required />
    </div>
    <div class="row">
      <input type="tel" name="phone" placeholder="Telefone (opcional)" />
      <input type="text" name="company" placeholder="Empresa" />
    </div>
    <textarea name="message" rows="6" placeholder="Mensagem" required></textarea>
    <label class="file-field">
      <span class="file-label">Anexos (opcional): 2 ficheiros no máximo, 5 MB cada · PDF, Word, JPG, PNG</span>
      <input type="file" name="attachments" multiple accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,image/jpeg,image/png"
             data-too-many="Pode anexar no máximo 2 ficheiros." data-too-big="Cada ficheiro deve ter menos de 5 MB: " data-bad-type="Formato não aceite (PDF, Word, JPG ou PNG): " />
    </label>
    <button type="submit" class="btn btn-primary">Enviar</button>
  </form>

  <footer>
    <div class="container footer-bottom">
      <div class="footer-brand"><a href="index.html" class="footer-logo"><img src="../assets/logo/pragma4-logo-horizontal.svg" alt="Pragma4 — Real-world value, through AI" width="200" height="44" loading="lazy" /></a></div>
    </div>
    <div class="container footer-bottom">
      <span>© 2026 Pragma4. Todos os direitos reservados.</span>
      <div class="socials">
        <a class="li-link" href="https://www.linkedin.com/company/pragma4/" target="_blank" rel="noopener" aria-label="LinkedIn"><svg class="li-ico" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect width="24" height="24" rx="4" fill="#0A66C2"/><path fill="#fff" d="M5.3 9.4h2.9v9.3H5.3zM6.75 4.8a1.68 1.68 0 1 1 0 3.36 1.68 1.68 0 0 1 0-3.36zM10 9.4h2.8v1.27h.04c.39-.74 1.34-1.52 2.76-1.52 2.95 0 3.5 1.94 3.5 4.47v5.08h-2.9v-4.5c0-1.07-.02-2.46-1.5-2.46-1.5 0-1.73 1.17-1.73 2.38v4.58H10z"/></svg><span>LINKEDIN</span></a>
      </div>
    </div>
    <div class="wordmark" aria-hidden="true"><img src="../assets/logo/pragma4-wordmark.svg" alt="" /></div>
  </footer>

  <script src="../assets/script.js"></script>
</body>
</html>
